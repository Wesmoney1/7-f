<!DOCTYPE html>
<html>
<head>
  <script type='text/javascript' src='https://cdn.scaledrone.com/scaledrone.min.js'></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <style>
  body {
    display: flex;
    height: 100vh;
    margin: 0;
    align-items: center;
    justify-content: center;
    padding: 0 50px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  video {
    max-width: calc(50% - 100px);
    margin: 0 50px;
    box-sizing: border-box;
    border-radius: 2px;
    padding: 0;
    box-shadow: rgba(156, 172, 172, 0.2) 0px 2px 2px, rgba(156, 172, 172, 0.2) 0px 4px 4px, rgba(156, 172, 172, 0.2) 0px 8px 8px, rgba(156, 172, 172, 0.2) 0px 16px 16px, rgba(156, 172, 172, 0.2) 0px 32px 32px, rgba(156, 172, 172, 0.2) 0px 64px 64px;
  }
  .copy {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 16px;
    color: rgba(0, 0, 0, 0.5);
  }
  </style>
</head>
<body>
  <div class="copy">
    <span id="roomDisplay">Room: ...</span>
    <button onclick="copyCode()">Copy Code</button>
    <div style="border-left: 1px solid #ddd; height: 20px; margin: 0 5px;"></div>
    <input type="text" id="joinInput" placeholder="Paste Room Code">
    <button onclick="joinRoom()">Join</button>
  </div>

  <video id="localVideo" autoplay muted></video>
  <video id="remoteVideo" autoplay></video>

  <script>
  // 1. SETUP ROOM IDENTIFIER
  if (!location.hash) {
    location.hash = Math.floor(Math.random() * 0xFFFFFF).toString(16);
  }
  const roomHash = location.hash.substring(1);
  const roomName = 'observable-' + roomHash;

  // 2. INITIALIZE SCALEDRONE
  const drone = new ScaleDrone('vTWPOER70X1GvIHG');
  const configuration = {
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  };
  let room;
  let pc;

  // 3. UI FUNCTIONS
  function copyCode() {
    navigator.clipboard.writeText(roomHash).then(() => {
      alert("Room code " + roomHash + " copied!");
    });
  }

  function joinRoom() {
    const code = document.getElementById('joinInput').value.trim();
    if (code) {
      location.hash = code;
      location.reload(); // Reloads the file with the new hash
    }
  }

  // 4. WEBRTC LOGIC
  function onSuccess() {};
  function onError(error) { console.error(error); };

  drone.on('open', error => {
    if (error) return console.error(error);
    room = drone.subscribe(roomName);

    room.on('members', members => {
      const isOfferer = members.length === 2;
      startWebRTC(isOfferer);
    });
  });

  function sendMessage(message) {
    drone.publish({ room: roomName, message });
  }

  function startWebRTC(isOfferer) {
    pc = new RTCPeerConnection(configuration);

    pc.onicecandidate = event => {
      if (event.candidate) sendMessage({'candidate': event.candidate});
    };

    if (isOfferer) {
      pc.onnegotiationneeded = () => {
        pc.createOffer().then(localDescCreated).catch(onError);
      }
    }

    pc.ontrack = event => {
      const stream = event.streams[0];
      if (!remoteVideo.srcObject || remoteVideo.srcObject.id !== stream.id) {
        remoteVideo.srcObject = stream;
      }
    };

    navigator.mediaDevices.getUserMedia({
      audio: true,
      video: true,
    }).then(stream => {
      localVideo.srcObject = stream;
      stream.getTracks().forEach(track => pc.addTrack(track, stream));
    }, onError);

    room.on('data', (message, client) => {
      if (client.id === drone.clientId) return;

      if (message.sdp) {
        pc.setRemoteDescription(new RTCSessionDescription(message.sdp), () => {
          if (pc.remoteDescription.type === 'offer') {
            pc.createAnswer().then(localDescCreated).catch(onError);
          }
        }, onError);
      } else if (message.candidate) {
        pc.addIceCandidate(new RTCIceCandidate(message.candidate), onSuccess, onError);
      }
    });
  }

  function localDescCreated(desc) {
    pc.setLocalDescription(desc, () => sendMessage({'sdp': pc.localDescription}), onError);
  }

  // 5. UPDATE UI (Placed at end so elements exist)
  document.getElementById('roomDisplay').innerText = "Room: " + roomHash;
  </script>
</body>
</html>
