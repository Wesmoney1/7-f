<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* Base reset */
      * { box-sizing: border-box; }
      /* User CSS */

    </style>
    <script>
      // Capture console.log to display in parent (Optional future enhancement, currently just preventing errors)
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('Preview Error:', message);
      };
    </script>
  </head>
  <body>
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Python IDE</title>
        <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
        <style>
          body { font-family: sans-serif; max-width: 1000px; margin: 20px auto; background: #f4f4f9; padding: 20px; }
          .tabs { display: flex; gap: 5px; margin-bottom: -1px; }
          .tab { padding: 8px 15px; background: #ddd; border: 1px solid #ccc; cursor: pointer; border-radius: 5px 5px 0 0; }
          .tab.active { background: white; font-weight: bold; border-top: 3px solid #4a90e2; }
          #editor-container { background: white; border: 1px solid #ccc; padding: 15px; }
          textarea { width: 100%; height: 250px; font-family: monospace; padding: 10px; box-sizing: border-box; }
          #output { background: #1e1e1e; color: #98c379; padding: 15px; margin-top: 20px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; }
          button { padding: 10px 20px; cursor: pointer; border: none; border-radius: 5px; }
          #run { background: #28a745; color: white; }
        </style>
      </head>
      <body>

        <div id="status">⏳ Initializing...</div>
        <div class="tabs" id="tab-bar"></div>
        <div id="editor-container"><textarea id="editor"></textarea></div>
        <div style="margin-top:10px;">
          <button onclick="addNewFile()">+ Add File</button>
          <button id="run" onclick="runProject()" disabled>Run Project</button>
        </div>
        <div id="output">Console output will appear here...</div>

        <script>
          let pyodide;
          let files = [{ name: 'main.py', content: "name = input('What is your name?')\nprint(f'Hello, {name}!')" }];
          let activeIndex = 0;

          async function init() {
            pyodide = await loadPyodide();
            document.getElementById('status').innerText = "✅ Python Ready";
            document.getElementById('run').disabled = false;
            render();
          }

          function render() {
            const bar = document.getElementById('tab-bar');
            bar.innerHTML = '';
            files.forEach((f, i) => {
              const t = document.createElement('div');
              t.className = `tab ${i === activeIndex ? 'active' : ''}`;
              t.innerText = f.name;
              t.onclick = () => { 
                files[activeIndex].content = document.getElementById('editor').value; 
                activeIndex = i; 
                render(); 
              };
              bar.appendChild(t);
            });
            document.getElementById('editor').value = files[activeIndex].content;
          }

          function addNewFile() {
            const n = prompt("Filename (e.g. module.py):");
            if(n && n.endsWith('.py')) { 
              files.push({name: n, content: "# New File"}); 
              render(); 
            }
          }

          async function runProject() {
            files[activeIndex].content = document.getElementById('editor').value;
            const out = document.getElementById('output');
            out.innerText = "Running...\n";

            // Map the JS prompt to the window so Python's 'js' module sees it
            window.js_input = (msg) => prompt(msg) || "";

            try {
              // Setup the environment and patch input
              await pyodide.runPythonAsync(`
import builtins
import js
import sys

builtins.input = lambda msg="": js.js_input(msg)

if '.' not in sys.path:
    sys.path.append('.')
            `);

              // Write and reload all files
              for (const f of files) {
                pyodide.FS.writeFile(f.name, f.content);
                const mod = f.name.replace('.py','');
                await pyodide.runPythonAsync(`
import sys, importlib
if '${mod}' in sys.modules:
    importlib.reload(sys.modules['${mod}'])
                `);
              }

              // Redirect stdout to our div
              pyodide.setStdout({ batched: (s) => out.innerText += s + "\n" });

              // Run main.py
              await pyodide.runPythonAsync(pyodide.FS.readFile('main.py', {encoding:'utf8'}));
            } catch (e) { 
              out.innerText += "\n" + e; 
            }
          }

          init();
        </script>
      </body>
    </html>
    <script>
      try {

      } catch (err) {
        console.error('Runtime Error:', err);
        document.body.innerHTML += '<div style="color:red; background:#ffe6e6; padding:10px; margin-top:20px; border-radius:4px; border:1px solid red;"><strong>Runtime Error:</strong> ' + err.message + '</div>';
      }
    </script>
  </body>
</html>
